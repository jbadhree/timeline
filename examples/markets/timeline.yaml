# Example Timeline root. The schema is documented in goals/events-and-types.md.
version: 1
name: markets

types:
  news:
    folder: news
    entry_timing: past # the event happened before it was entered
    fields:
      text: { type: string, required: true }
      ticker: { type: string, required: true }

  prediction:
    folder: predictions
    entry_timing: future # entered before the expected event
    history: true # keep every recorded version under history/predictions/
    frozen: [pred, ticker, explanation, timeline_at] # the claim cannot change after it is recorded
    fields:
      pred: { type: string, required: true }
      ticker: { type: string, required: true }
      explanation: { type: string, required: true }
      beliefs: { type: list, items: string, required: false }
