name: Release

# Publishes a GitHub Release when a version tag such as v0.1.0 is pushed.
# Every check must pass on macOS and Linux, and each binary must run on its
# own OS, before anything is published.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - run: make check
      - run: make race

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Require a license
        run: test -f LICENSE || { echo "::error::Add a LICENSE file before releasing; without one, nobody may legally use tline."; exit 1; }
      - run: make release VERSION=${{ github.ref_name }}
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dist
          path: dist/

  smoke:
    needs: build
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux_amd64
          - os: macos-latest
            platform: darwin_arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist
      - name: Verify checksums and run the binary
        run: |
          cd dist
          shasum -a 256 -c SHA256SUMS
          name=tline_${{ github.ref_name }}_${{ matrix.platform }}
          tar -xzf "$name.tar.gz"
          "./$name/tline" --version | grep -F "tline ${{ github.ref_name }}"
          "./$name/tline" --help | grep -F "goals plugin"

  publish:
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/*.tar.gz dist/SHA256SUMS \
            --repo "${{ github.repository }}" \
            --title "tline ${{ github.ref_name }}" \
            --generate-notes \
            --prerelease
