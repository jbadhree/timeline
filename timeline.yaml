# This repository is a Timeline root: its plan and design are goals and tasks,
# and the design decisions behind them are decisions.
# Start at goals/primary-goal-build-timeline.md.
version: 1
name: timeline

types:
  goal:
    folder: goals # from the built-in goals plugin
  task:
    folder: tasks # from the built-in goals plugin

  decision:
    folder: decisions
    entry_timing: past # recorded after it was made
    status: { values: [current, superseded], closed: [superseded] }
    fields:
      decision: { type: string, required: true }
      decided_by: { type: string, required: true }
    sections: [Context, Consequences]
